
name: Build SDJM APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -o SDJM_Android_Project.zip -d extracted
          find extracted -maxdepth 3 -type f

      - name: Build APK
        run: |
          cd extracted/SDJM_Android_Project
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SDJM-debug-APK
          path: extracted/SDJM_Android_Project/app/build/outputs/apk/debug/*.apk
